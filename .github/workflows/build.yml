name: Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# The FrameTrail release whose serializer, validator and schemas the
# JavaScript tests load (see tests/run-js.mjs), and whose fixtures and schemas
# the PHP tests check the ports against (see tests/run-php.php): the oldest
# release that has them as the add-on uses them.
env:
  FRAMETRAIL_REF: v1.4.1
  FRAMETRAIL_DIR: frametrail

jobs:
  test-js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout FrameTrail
        uses: actions/checkout@v4
        with:
          repository: OpenHypervideo/FrameTrail
          ref: ${{ env.FRAMETRAIL_REF }}
          path: ${{ env.FRAMETRAIL_DIR }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The client part and the conformance fixtures (see tests/run-js.mjs); no dependencies
      - name: Run tests
        run: node --test-reporter=spec tests/run-js.mjs

  test-php:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: ['7.4', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout FrameTrail
        uses: actions/checkout@v4
        with:
          repository: OpenHypervideo/FrameTrail
          ref: ${{ env.FRAMETRAIL_REF }}
          path: ${{ env.FRAMETRAIL_DIR }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # The server part and the conformance fixtures (see tests/run-php.php); no dependencies
      - name: Run tests
        run: php tests/run-php.php

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout FrameTrail
        uses: actions/checkout@v4
        with:
          repository: OpenHypervideo/FrameTrail
          ref: ${{ env.FRAMETRAIL_REF }}
          path: ${{ env.FRAMETRAIL_DIR }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      # Both interpreters run the same conformance cases: a case that only one
      # runner reads fails here
      - name: Compare the fixture cases of both runners
        run: diff <(node tests/run-js.mjs --list-fixtures) <(php tests/run-php.php --list-fixtures)

      - name: Build
        run: bash scripts/build.sh

      # The same tests against what the build wrote
      - name: Test the build
        run: |
          node --test-reporter=spec tests/run-js.mjs --build
          php tests/run-php.php --build

      # Downloadable from the Actions tab for 7 days
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frametrail-conversational-ui-build
          path: build/
          retention-days: 7
