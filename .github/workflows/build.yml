name: Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# The FrameTrail whose serializer, keyframe math, lint, validator, schemas,
# lint cases and type reference the JavaScript tests load (see
# tests/run-js.mjs): the develop commit that brought FrameTrailLint and
# docs/TYPES.md, until a FrameTrail release has them; then that release's tag.
env:
  FRAMETRAIL_REF: 22c385839e44b89b4a333aab49f873fbc69565f2
  FRAMETRAIL_DIR: frametrail

jobs:
  test-js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout FrameTrail
        uses: actions/checkout@v4
        with:
          repository: OpenHypervideo/FrameTrail
          ref: ${{ env.FRAMETRAIL_REF }}
          path: ${{ env.FRAMETRAIL_DIR }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The client part and the conformance fixtures (see tests/run-js.mjs); no dependencies
      - name: Run tests
        run: node --test-reporter=spec tests/run-js.mjs

  test-php:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: ['7.4', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # The server part (see tests/run-php.php); no dependencies
      - name: Run tests
        run: php tests/run-php.php

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout FrameTrail
        uses: actions/checkout@v4
        with:
          repository: OpenHypervideo/FrameTrail
          ref: ${{ env.FRAMETRAIL_REF }}
          path: ${{ env.FRAMETRAIL_DIR }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      - name: Build
        run: bash scripts/build.sh

      # The same tests against what the build wrote
      - name: Test the build
        run: |
          node --test-reporter=spec tests/run-js.mjs --build
          php tests/run-php.php --build

      # Downloadable from the Actions tab for 7 days
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frametrail-conversational-ui-build
          path: build/
          retention-days: 7
